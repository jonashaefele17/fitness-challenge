name: Weekly database export

# Supabase Free has no automatic backups. Every Sunday 03:00 UTC both databases are
# dumped, encrypted with BACKUP_PASSPHRASE and stored as workflow artifacts (90 days).
# The repository is public, so dumps are never uploaded unencrypted.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: Export staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/db-export.sh staging
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v5
        with:
          name: db-export-staging-${{ github.run_id }}
          path: export/*.gpg
          retention-days: 90
          if-no-files-found: error

  live:
    name: Export live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/db-export.sh live
        env:
          DB_URL: ${{ secrets.LIVE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v5
        with:
          name: db-export-live-${{ github.run_id }}
          path: export/*.gpg
          retention-days: 90
          # LIVE_DB_URL may not be configured yet; the script then skips.
          if-no-files-found: ignore
